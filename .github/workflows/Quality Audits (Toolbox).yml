name: Quality Audits (Toolbox).yml

# Objectif : tester les outils de la boîte à outils CI/CD
# Référentiel RNCP : Ce2.2.4 (sécurité), Ce2.3.5 (accessibilité), Ce2.3.3 (performance/SEO)


on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skip Dependabot and Release Please PRs — no functional code changes
  check:
    name: 🔍 Should run audits?
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - id: detect
        run: |
          if [[ "${{ github.head_ref }}" == dependabot/* ]] || [[ "${{ github.head_ref }}" == release-please--* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────
  # JOB 1 : size-limit - Budget de performance bundle
  # Remplace bundlephobia (CLI non disponible) pour l'usage CI
  # Référentiel : Ce2.3.3 (éco-conception, performance)
  # ─────────────────────────────────────────────────────────────────────
  bundle-size:
    name: 📦 Bundle Size Budget
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.skip == 'false'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci
          if ! npm list @rollup/rollup-linux-x64-gnu > /dev/null 2>&1; then
            echo "⚠️ Rollup optional dependency missing, reinstalling..."
            rm -rf node_modules package-lock.json
            npm install --include=optional
          fi

      - name: 🏗️ Build
        run: npm run build
        env:
          ROLLUP_SKIP_NODE_NATIVE: "true"
          VITE_API_SERVER_URL: "https://mock-api.example.com"
          VITE_REDIRECT_URI: "https://mock.example.com"
          VITE_API_V1: "/v1"
          VITE_API_V2: "/v2"

      - name: 📊 Analyse bundle avec vite-bundle-visualizer
        run: |
          echo "=== Taille du bundle produit ==="
          du -sh dist/assets/*.js 2>/dev/null | sort -h || echo "Pas de JS dans dist/assets"
          du -sh dist/assets/*.css 2>/dev/null | sort -h || echo "Pas de CSS dans dist/assets"
          echo ""
          echo "=== Total dist/ ==="
          du -sh dist/
          echo ""
          echo "=== Objectif : < 600kb gzipped (planning_ameliorations_v2.md) ==="
          # Calcul taille gzippée approximative
          total_gz=$(find dist -name "*.js" -o -name "*.css" | xargs gzip -c | wc -c)
          echo "Taille gzippée estimée : $(echo $total_gz | awk '{printf "%.0f KB", $1/1024}')"
        continue-on-error: true

      - name: 🔍 Vite bundle visualizer (rapport HTML)
        run: |
          mkdir -p bundle-report
           # Capturer stdout pour extraire "Generated at /tmp/..."
           OUTPUT=$(npx vite-bundle-visualizer --open false 2>&1)
          echo "$OUTPUT"
          STATS_PATH=$(echo "$OUTPUT" | grep "Generated at" | awk '{print $NF}')
          echo "Chemin détecté : $STATS_PATH"
          if [ -n "$STATS_PATH" ] && [ -f "$STATS_PATH" ]; then
            cp "$STATS_PATH" bundle-report/stats.html
            echo "✅ stats.html copié"
          else
             echo "⚠️ Copie échouée"
          fi
        continue-on-error: true

      - name: 📤 Upload bundle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-size-report
          path: bundle-report/stats.html
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # JOB 2 : Lighthouse CI (Performance + Accessibilité + SEO + Best Practices)
  # Référentiel : Ce2.3.3 (performance), Ce2.3.5 (accessibilité)
  # Couvre aussi le "Lighthouse SEO" mentionné dans la boîte à outils
  # ─────────────────────────────────────────────────────────────────────
  lighthouse-ci:
    name: 🏠 Lighthouse CI (Perf + A11y + SEO)
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.skip == 'false'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci
          if ! npm list @rollup/rollup-linux-x64-gnu > /dev/null 2>&1; then
            echo "⚠️ Rollup optional dependency missing, reinstalling..."
            rm -rf node_modules package-lock.json
            npm install --include=optional
          fi

      - name: 🏗️ Build
        run: npm run build
        env:
          ROLLUP_SKIP_NODE_NATIVE: "true"
          VITE_API_SERVER_URL: "https://mock-api.example.com"
          VITE_REDIRECT_URI: "https://mock.example.com"
          VITE_API_V1: "/v1"
          VITE_API_V2: "/v2"

      - name: 🔧 Install LHCI
        run: npm install -g @lhci/cli

      - name: 🚀 Serve dist locally
        run: |
          npm install -g serve
          serve -s dist -p 3000 &
          # Attendre que le serveur soit prêt
          npx wait-on http://localhost:3000 --timeout 30000

      - name: 🏠 Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url=http://localhost:3000 \
            --collect.numberOfRuns=1 \
            --assert.assertions.categories:performance=warn \
            --assert.assertions.categories:accessibility=warn \
            --assert.assertions.categories:seo=warn \
            --assert.assertions.categories:best-practices=warn \
            --upload.target=temporary-public-storage
        # Note : --upload.target=temporary-public-storage envoie les résultats
        # sur le stockage public temporaire LHCI (gratuit, 7 jours de rétention)
        # Alternative : utiliser un lhci-server auto-hébergé pour historique
        continue-on-error: true
        # continue-on-error: true car c'est une phase d'expérimentation
        # Passer à false quand les seuils sont stabilisés

  # ─────────────────────────────────────────────────────────────────────
  # JOB 3 : axe-core - Tests accessibilité automatisés
  # Référentiel : Ce2.3.5
  # Rappel boîte à outils : valide ~25-30% d'un audit, reste = analyse humaine
  # ─────────────────────────────────────────────────────────────────────
  axe-accessibility:
    name: ♿ axe-core Accessibility
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.skip == 'false'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci
          if ! npm list @rollup/rollup-linux-x64-gnu > /dev/null 2>&1; then
            echo "⚠️ Rollup optional dependency missing, reinstalling..."
            rm -rf node_modules package-lock.json
            npm install --include=optional
          fi

      - name: 🏗️ Build
        run: npm run build
        env:
          ROLLUP_SKIP_NODE_NATIVE: "true"
          VITE_API_SERVER_URL: "https://mock-api.example.com"
          VITE_REDIRECT_URI: "https://mock.example.com"
          VITE_API_V1: "/v1"
          VITE_API_V2: "/v2"

      - name: 🔧 Install axe-core CLI + serveur local
        run: |
          npm install -g @axe-core/cli serve
          npm install -g wait-on
          # Synchroniser Chrome et ChromeDriver pour éviter le mismatch de versions
          npx browser-driver-manager install chrome

      - name: 🚀 Serve + Run axe
        run: |
          serve -s dist -p 3001 &
          npx wait-on http://localhost:3001 --timeout 30000
          echo "Lancement audit axe-core..."
          axe http://localhost:3001 --exit || true
          # --exit : code de sortie != 0 si violations trouvées
          # || true : ne pas faire échouer le workflow en phase expé
        # Pour activer le blocage strict plus tard, retirer "|| true"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────
  # JOB 4 : TruffleHog - Scan de secrets dans le repo
  # Référentiel : Ce2.2.4 (sécurité)
  # ─────────────────────────────────────────────────────────────────────
  trufflehog-security:
    name: 🔐 TruffleHog - Secret Scanning
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.skip == 'false'

    steps:
      - name: 📥 Checkout (full history pour scan complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # fetch-depth: 0 = historique complet nécessaire pour TruffleHog

      - name: 🔍 Fetch main pour comparaison
        run: git fetch origin main:main || echo "⚠️ Impossible de fetcher main, scan complet du repo"

      - name: 🔐 TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified
          # --only-verified : ne remonte que les secrets vérifiés (moins de faux positifs)
        continue-on-error: true
        # Passer à false en production pour bloquer les PR avec secrets

  # ─────────────────────────────────────────────────────────────────────
  # SUMMARY : Résumé des audits expérimentaux
  # ─────────────────────────────────────────────────────────────────────
  toolbox-summary:
    name: 📋 Toolbox Summary
    runs-on: ubuntu-latest
    needs: [check, lighthouse-ci, axe-accessibility, trufflehog-security, bundle-size]
    if: always() && needs.check.outputs.skip == 'false'

    steps:
      - name: 📋 Résumé des audits
        run: |
          echo "## 🧪 Toolbox Experiments - Résultats" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Outil | Référentiel RNCP | Résultat |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------------------|---------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lighthouse-ci.result }}" == "success" ]; then
            echo "| 🏠 Lighthouse CI (Perf+A11y+SEO) | Ce2.3.3, Ce2.3.5 | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏠 Lighthouse CI (Perf+A11y+SEO) | Ce2.3.3, Ce2.3.5 | ⚠️ Voir rapport |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.axe-accessibility.result }}" == "success" ]; then
            echo "| ♿ axe-core | Ce2.3.5 | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ♿ axe-core | Ce2.3.5 | ⚠️ Violations détectées |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.trufflehog-security.result }}" == "success" ]; then
            echo "| 🔐 TruffleHog | Ce2.2.4 | ✅ Aucun secret détecté |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔐 TruffleHog | Ce2.2.4 | ❌ Secrets détectés - Action requise |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.bundle-size.result }}" == "success" ]; then
            echo "| 📦 Bundle Size | Ce2.3.3 | ✅ Rapport généré |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📦 Bundle Size | Ce2.3.3 | ⚠️ Voir logs |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Notes" >> $GITHUB_STEP_SUMMARY
          echo "- Ce workflow est **expérimental** (\`continue-on-error: true\`)" >> $GITHUB_STEP_SUMMARY
          echo "- Kastor (kastor.green) = audit manuel uniquement, non automatisable" >> $GITHUB_STEP_SUMMARY
          echo "- bundlephobia = outil web uniquement, remplacé par size-limit/vite-bundle-visualizer" >> $GITHUB_STEP_SUMMARY
          echo "- Lighthouse SEO = inclus dans Lighthouse CI (pas d'outil séparé nécessaire)" >> $GITHUB_STEP_SUMMARY
          echo "- axe-core valide ~25-30% d'un audit a11y (reste = analyse humaine RGAA)" >> $GITHUB_STEP_SUMMARY













