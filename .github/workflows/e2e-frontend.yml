name: 🎭 E2E Frontend - Playwright

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Lundi 6h UTC — détection régressions e2e sur main

permissions:
  contents: read

jobs:
  e2e-frontend:
    name: 🧪 Auth + Smoke E2E
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run E2E tests
        run: npm run test:e2e
        env:
          # Staging (Azure Static Web Apps `staging` + backend Render + Aiven MySQL)
          # — jamais la prod. Voir docs/17-E2E-TESTS-GUIDE.md et ADR-015.
          E2E_BASE_URL: https://brave-field-03611eb03-staging.5.azurestaticapps.net
          AZURE_TEST_USERNAME: ${{ secrets.AZURE_TEST_USERNAME }}
          AZURE_TEST_PASSWORD: ${{ secrets.AZURE_TEST_PASSWORD }}

      - name: 📊 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
