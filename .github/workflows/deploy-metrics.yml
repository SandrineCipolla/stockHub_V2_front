name: 📊 Deploy Metrics Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies (workaround for npm optional deps bug)
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional

      - name: 🛠️ Build project
        run: npm run build

      - name: 🌐 Start local server
        run: |
          npm install -g serve
          serve -s dist -l 4173 &
          sleep 5

      - name: 📊 Generate metrics data
        run: |
          mkdir -p documentation/metrics/data
          # Lancer les audits indépendants en parallèle (gain ~1min)
          node scripts/audit-fps.mjs &
          node scripts/audit-wcag.mjs &
          node scripts/audit-datasets.mjs &
          node scripts/audit-colorblind.mjs &
          wait  # Attendre que tous les audits parallèles se terminent
          # Audits qui dépendent du serveur (séquentiels)
          node scripts/generate-lighthouse.mjs || echo "Lighthouse generation failed"
          node scripts/generate-eco.mjs || echo "Eco generation failed"
          node scripts/generate-coverage.mjs || echo "Coverage generation failed"
          # Copie coverage IMMÉDIATEMENT après generation
          if [ -d coverage ]; then
            echo "📁 Contenu du dossier coverage:"
            ls -la coverage/ | head -20
            mkdir -p documentation/metrics/coverage
            cp -r coverage/* documentation/metrics/coverage/ || true
            echo "✅ Fichiers copiés vers documentation/metrics/coverage/"
            ls -la documentation/metrics/coverage/ | head -20
          else
            echo "⚠️  Dossier coverage introuvable"
          fi
          node scripts/audit-full.mjs || echo "Full audit failed"
          # Mettre à jour la liste statique des fichiers JSON dans index.html
          node scripts/update-metrics-files.mjs

      - name: 🏗️ Setup Pages
        uses: actions/configure-pages@v5

      - name: 📂 Upload metrics folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: './documentation/metrics'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
