name: 🧪 Azure Static Web Apps — Deploy staging / feature

# staging : miroir de `main`, déployé à chaque push sur `main`.
# feature : déploiement manuel d'une branche pour la tester en ligne (une à la fois).
# Les deux appellent le backend de test (Render), jamais celui de la production. Voir ADR-015.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible'
        type: choice
        options:
          - feature
          - staging
        default: feature

permissions:
  contents: read
  pull-requests: write

# Un seul déploiement à la fois par environnement.
concurrency:
  group: azure-swa-${{ github.event_name == 'push' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy_test_env:
    runs-on: ubuntu-latest
    name: 🏗️ Deploy ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci --no-optional && npm install --no-save @rollup/rollup-linux-x64-gnu || npm ci

      - name: 🏗️ Build (backend Render de test)
        env:
          VITE_API_SERVER_URL: https://stockhub-back.onrender.com/api
          VITE_API_V1: /v1
          VITE_API_V2: /v2
          VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
          VITE_TENANT_NAME: ${{ secrets.VITE_TENANT_NAME }}
          VITE_AUTHORITY_DOMAIN: ${{ secrets.VITE_AUTHORITY_DOMAIN }}
          VITE_SIGN_UP_SIGN_IN_POLICY: ${{ secrets.VITE_SIGN_UP_SIGN_IN_POLICY }}
          VITE_FORGOT_PASSWORD_POLICY: ${{ secrets.VITE_FORGOT_PASSWORD_POLICY }}
          VITE_EDIT_PROFILE_POLICY: ${{ secrets.VITE_EDIT_PROFILE_POLICY }}
          VITE_SCOPE_READ: ${{ secrets.VITE_SCOPE_READ }}
          VITE_SCOPE_WRITE: ${{ secrets.VITE_SCOPE_WRITE }}
          VITE_BASE_PATH: /
        run: npm run build

      - name: 🧪 Tests
        run: npm run test:run

      - name: 🚀 Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_FIELD_03611EB03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          skip_app_build: true
          skip_api_build: true
          app_location: 'dist'
          api_location: ''
          output_location: ''
          deployment_environment: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
