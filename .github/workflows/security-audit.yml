name: 🔒 Security Audit

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Lundi 5h UTC — détection des vulnérabilités publiées depuis le dernier push
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: 🛡️ npm audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 npm audit (high et critical bloquants)
        run: npm audit --audit-level=high

      - name: 📋 Vulnérabilités moderate et low (informatif)
        if: always()
        run: npm audit --audit-level=moderate || echo "⚠️ Vulnérabilités MODERATE/LOW présentes (non bloquantes)"

      - name: 📦 Dépendances obsolètes (informatif)
        if: always()
        run: npm outdated || true
