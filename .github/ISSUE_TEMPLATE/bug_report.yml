name: "🐛 Bug Report"
description: "Signaler un bug ou comportement inattendu"
labels: ["front", "bug"]
body:
  - type: dropdown
    id: severite
    attributes:
      label: "Sévérité"
      options:
        - "🔴 Bloquant"
        - "🟠 Majeur"
        - "🟡 Mineur"
        - "⚪ Cosmétique"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: "Module"
      options:
        - "Frontend"
        - "Backend"
        - "Design System"
        - "CI/CD"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description du bug"
      placeholder: "Décris clairement ce qui ne fonctionne pas..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Étapes pour reproduire"
      value: |
        1. Aller sur...
        2. Cliquer sur...
        3. Observer...
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: "Comportement attendu"
    validations:
      required: true

  - type: textarea
    id: actuel
    attributes:
      label: "Comportement actuel"
    validations:
      required: true

  - type: textarea
    id: contexte
    attributes:
      label: "Contexte technique (optionnel)"
      placeholder: "OS, navigateur, version Node.js, logs console, screenshot..."
